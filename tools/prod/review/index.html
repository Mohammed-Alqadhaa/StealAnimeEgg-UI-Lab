<html lang="en"><head><meta charset="utf-8"><title>SAE Production UI Review</title>
<link rel="stylesheet" href="../../../preview/data/fonts.css">
<style>
html,body{margin:0;background:#0d0820;overflow:hidden}
#stage{position:relative;overflow:hidden}
.world{position:absolute;inset:0;background:linear-gradient(#5fb8ff,#bfe6ff 45%,#63d64a 46%,#4bb83a)}

.rbx{position:absolute;box-sizing:border-box}.rbx .img{position:absolute;pointer-events:none}

#note{position:absolute;left:8px;bottom:4px;font:11px sans-serif;color:#fff;opacity:.75;text-shadow:0 1px 2px #000}
</style></head><body>
<div id="stage"><div class="world"></div><div id="screen"></div></div>
